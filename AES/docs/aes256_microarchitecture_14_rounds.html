<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AES-256 Iterative Microarchitecture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #111; font-family: Arial, Helvetica, sans-serif; }
    main { max-width: 1750px; margin: 0 auto; padding: 20px; }
    .frame { overflow: auto; border: 1px solid #777; }
    svg { display: block; width: 100%; min-width: 1350px; height: auto; background: #fff; }
    text { fill: #111; font-family: Consolas, "Courier New", monospace; }
    .module { fill: #fff; stroke: #111; stroke-width: 1.6; }
    .register { fill: #f7f7f7; stroke: #111; stroke-width: 2; }
    .logic { fill: #fff; stroke: #555; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .port { fill: #fff; stroke: #777; stroke-width: 1.2; }
    .roundbox { fill: #fff; stroke: #111; stroke-width: 1.7; }
    .name { font-size: 14px; font-weight: 700; }
    .small { font-size: 11px; }
    .tiny { font-size: 9.5px; }
    .headline { font-size: 18px; font-weight: 700; }
    .wire { fill: none; stroke: #111; stroke-width: 1.7; marker-end: url(#arrow); }
    .control { fill: none; stroke: #111; stroke-width: 1.3; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #111; stroke-width: 2.5; marker-end: url(#arrow); }
    .timeline { fill: #fff; stroke: #111; stroke-width: 1.2; }
  </style>
</head>
<body>
  <main>
    <div class="frame">
      <svg viewBox="0 0 1700 1050" role="img" aria-label="AES-256 iterative microarchitecture with fourteen round cycles">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0 0L8 4L0 8z" fill="#111"/>
          </marker>
        </defs>

        <text x="40" y="42" class="headline">aes256_core — iterative microarchitecture</text>

        <!-- Key path -->
        <rect x="35" y="90" width="150" height="50" class="port"/>
        <text x="110" y="120" text-anchor="middle" class="name">key[255:0]</text>
        <rect x="250" y="85" width="150" height="60" class="register"/>
        <text x="325" y="121" text-anchor="middle" class="name">key_reg</text>
        <rect x="470" y="75" width="265" height="80" class="module"/>
        <text x="602" y="121" text-anchor="middle" class="name">aes256_key_schedule</text>
        <rect x="810" y="75" width="245" height="80" class="logic"/>
        <text x="932" y="108" text-anchor="middle" class="name">round-key select</text>
        <text x="932" y="131" text-anchor="middle" class="tiny">round_keys[round_count*128 +: 128]</text>
        <rect x="1130" y="85" width="180" height="60" class="logic"/>
        <text x="1220" y="121" text-anchor="middle" class="name">reverse_bytes</text>
        <path d="M185 115H250M400 115H470M735 115H810M1055 115H1130" class="wire"/>

        <!-- Initial state load -->
        <rect x="35" y="355" width="180" height="55" class="port"/>
        <text x="125" y="388" text-anchor="middle" class="name">plaintext[127:0]</text>
        <rect x="260" y="352" width="180" height="60" class="logic"/>
        <text x="350" y="388" text-anchor="middle" class="name">reverse_bytes</text>
        <circle cx="505" cy="382" r="25" fill="#fff" stroke="#111" stroke-width="1.6"/>
        <text x="505" y="390" text-anchor="middle" class="headline">⊕</text>
        <rect x="565" y="337" width="170" height="90" class="register"/>
        <text x="650" y="376" text-anchor="middle" class="name">state_reg</text>
        <text x="650" y="400" text-anchor="middle" class="small">128 bits</text>
        <path d="M215 382H260M440 382H480M530 382H565" class="wire"/>
        <path d="M110 140V285H505V357" class="wire"/>
        <text x="120" y="276" class="tiny">key[255:128]</text>

        <!-- Normal round 1..13 -->
        <rect x="795" y="285" width="580" height="190" rx="5" class="roundbox"/>
        <text x="820" y="318" class="name">aes_round</text>
        <text x="1345" y="318" text-anchor="end" class="small">round_count = 1..13</text>
        <rect x="810" y="350" width="115" height="65" class="module"/>
        <text x="867" y="388" text-anchor="middle" class="small">aes_subbytes</text>
        <rect x="945" y="350" width="115" height="65" class="module"/>
        <text x="1002" y="388" text-anchor="middle" class="small">aes_shiftrows</text>
        <rect x="1080" y="350" width="125" height="65" class="module"/>
        <text x="1142" y="388" text-anchor="middle" class="small">aes_mixcolumns</text>
        <rect x="1225" y="350" width="125" height="65" class="module"/>
        <text x="1287" y="388" text-anchor="middle" class="small">aes_addroundkey</text>
        <path d="M735 365H770V382H810M925 382H945M1060 382H1080M1205 382H1225" class="wire"/>

        <!-- Final round 14 -->
        <rect x="795" y="535" width="580" height="190" rx="5" class="roundbox"/>
        <text x="820" y="568" class="name">aes_roundlast</text>
        <text x="1345" y="568" text-anchor="end" class="small">round_count = 14</text>
        <rect x="840" y="600" width="135" height="65" class="module"/>
        <text x="907" y="638" text-anchor="middle" class="small">aes_subbytes</text>
        <rect x="1015" y="600" width="140" height="65" class="module"/>
        <text x="1085" y="638" text-anchor="middle" class="small">aes_shiftrows</text>
        <rect x="1195" y="600" width="155" height="65" class="module"/>
        <text x="1272" y="638" text-anchor="middle" class="small">aes_addroundkey</text>
        <path d="M735 399H765V632H840M975 632H1015M1155 632H1195" class="wire"/>

        <!-- Selected round-key fanout routed outside modules -->
        <path d="M1310 115H1405V382H1350" class="wire"/>
        <path d="M1405 382V632H1350" class="wire"/>

        <!-- Sequential next-state selection -->
        <rect x="1450" y="425" width="190" height="105" class="logic"/>
        <text x="1545" y="465" text-anchor="middle" class="name">next-state select</text>
        <text x="1545" y="491" text-anchor="middle" class="small">round_count &lt; 14</text>
        <path d="M1350 382H1415V455H1450" class="wire"/>
        <path d="M1350 632H1425V500H1450" class="wire"/>
        <path d="M1640 477H1660V780H650V427" class="feedback"/>
        <text x="890" y="758" class="name">feedback: one state update per round</text>

        <!-- Ciphertext path from actual final_round_out -->
        <rect x="1450" y="600" width="170" height="60" class="logic"/>
        <text x="1535" y="636" text-anchor="middle" class="name">reverse_bytes</text>
        <rect x="1450" y="690" width="170" height="55" class="register"/>
        <text x="1535" y="723" text-anchor="middle" class="name">ciphertext</text>
        <path d="M1350 632H1450M1535 660V690" class="wire"/>

        <!-- Control -->
        <rect x="75" y="805" width="260" height="80" class="logic"/>
        <text x="205" y="838" text-anchor="middle" class="name">start / busy / done</text>
        <text x="205" y="863" text-anchor="middle" class="small">control in aes256_core</text>
        <rect x="430" y="805" width="190" height="80" class="register"/>
        <text x="525" y="838" text-anchor="middle" class="name">round_count[3:0]</text>
        <text x="525" y="863" text-anchor="middle" class="small">1 → 14</text>
        <path d="M335 845H430" class="control"/>
        <path d="M525 805H460V190H932V155" class="control"/>
        <path d="M620 845H1660V550H1545V530" class="control"/>

        <!-- Cycle timeline -->
        <g>
          <rect x="40" y="940" width="130" height="60" class="timeline"/>
          <text x="105" y="965" text-anchor="middle" class="name">T0</text><text x="105" y="987" text-anchor="middle" class="tiny">Initial ARK</text>
          <rect x="170" y="940" width="85" height="60" class="timeline"/><text x="212" y="976" text-anchor="middle" class="name">R1</text>
          <rect x="255" y="940" width="85" height="60" class="timeline"/><text x="297" y="976" text-anchor="middle" class="name">R2</text>
          <rect x="340" y="940" width="85" height="60" class="timeline"/><text x="382" y="976" text-anchor="middle" class="name">R3</text>
          <rect x="425" y="940" width="85" height="60" class="timeline"/><text x="467" y="976" text-anchor="middle" class="name">R4</text>
          <rect x="510" y="940" width="85" height="60" class="timeline"/><text x="552" y="976" text-anchor="middle" class="name">R5</text>
          <rect x="595" y="940" width="85" height="60" class="timeline"/><text x="637" y="976" text-anchor="middle" class="name">R6</text>
          <rect x="680" y="940" width="85" height="60" class="timeline"/><text x="722" y="976" text-anchor="middle" class="name">R7</text>
          <rect x="765" y="940" width="85" height="60" class="timeline"/><text x="807" y="976" text-anchor="middle" class="name">R8</text>
          <rect x="850" y="940" width="85" height="60" class="timeline"/><text x="892" y="976" text-anchor="middle" class="name">R9</text>
          <rect x="935" y="940" width="85" height="60" class="timeline"/><text x="977" y="976" text-anchor="middle" class="name">R10</text>
          <rect x="1020" y="940" width="85" height="60" class="timeline"/><text x="1062" y="976" text-anchor="middle" class="name">R11</text>
          <rect x="1105" y="940" width="85" height="60" class="timeline"/><text x="1147" y="976" text-anchor="middle" class="name">R12</text>
          <rect x="1190" y="940" width="85" height="60" class="timeline"/><text x="1232" y="976" text-anchor="middle" class="name">R13</text>
          <rect x="1275" y="940" width="150" height="60" class="timeline"/><text x="1350" y="965" text-anchor="middle" class="name">R14 / done = 1</text><text x="1350" y="987" text-anchor="middle" class="tiny">Final / ciphertext valid</text>
          <rect x="1425" y="940" width="140" height="60" class="timeline"/><text x="1495" y="965" text-anchor="middle" class="name">T15</text><text x="1495" y="987" text-anchor="middle" class="tiny">next start</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
